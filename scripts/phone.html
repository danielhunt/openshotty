<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>iPhone frame — 390×844</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0a0c;
        font: 13px system-ui;
        color: #777;
      }
      .phone {
        padding: 10px;
        background: #1c1c20;
        border-radius: 44px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
      }
      iframe {
        width: 390px;
        height: 844px;
        border: 0;
        display: block;
        background: #000;
        border-radius: 34px;
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <!-- dev only: copy into dist/ to preview at iPhone size, with the offline
           cache switched off so edits are visible at once:
           npx vite build && cp scripts/phone.html dist/phone.html && npx vite preview
           Query string is forwarded to the game, so /phone.html?fresh works, and
           ?w=&h= resize the frame (anything else is passed through untouched). -->
      <iframe id="f" src="./index.html" allow="camera;microphone;autoplay;sensor"></iframe>
    </div>
    <script>
      const q = new URLSearchParams(location.search);
      const num = (key, fallback) => {
        const n = Number(q.get(key));
        return Number.isFinite(n) && n > 0 ? n : fallback;
      };
      const w = Math.round(Math.min(900, Math.max(280, num('w', 390))));
      const h = Math.round(Math.min(1000, Math.max(300, num('h', 844))));
      const f = document.getElementById('f');
      f.style.width = w + 'px';
      f.style.height = h + 'px';
      document.title = `iPhone frame — ${w}×${h}`;

      // hand everything except the frame's own size knobs to the game
      const game = new URLSearchParams(q);
      game.delete('w');
      game.delete('h');
      game.set('nosw', '');
      f.src = './index.html?' + game.toString();
    </script>
  </body>
</html>
